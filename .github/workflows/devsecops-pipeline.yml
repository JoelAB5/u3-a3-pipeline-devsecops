name: DevSecOps Basic Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scans:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar analizadores en entorno separado
        run: |
          python -m pip install --upgrade pip
          python -m venv .venv-security
          .venv-security/bin/pip install -r requirements-security.txt
          mkdir -p reports

      - name: Instalar dependencias de la aplicacion
        run: |
          python -m venv .venv-app
          .venv-app/bin/pip install -r requirements.txt

      - name: Analisis SAST con Bandit severidad alta
        id: sast
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          .venv-security/bin/bandit app.py -lll -f txt 2>&1 | tee reports/bandit-alta.txt

      - name: Analisis SAST de credenciales con Bandit
        id: secrets
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          .venv-security/bin/bandit app.py -t B105,B106,B107 -l -f txt 2>&1 | tee reports/bandit-credenciales.txt

      - name: Analisis SCA con Safety
        id: sca
        continue-on-error: true
        env:
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
        shell: bash
        run: |
          set -o pipefail
          if [ -z "$SAFETY_API_KEY" ]; then
            echo "ERROR: configura el secreto SAFETY_API_KEY del repositorio para ejecutar Safety." | tee reports/safety.txt
            exit 2
          fi
          .venv-security/bin/safety --key "$SAFETY_API_KEY" check -r requirements.txt --full-report 2>&1 | tee reports/safety.txt

      - name: Conservar informes de seguridad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn

      - name: Build Breaker
        if: always()
        env:
          SAST: ${{ steps.sast.outcome }}
          SECRETS: ${{ steps.secrets.outcome }}
          SCA: ${{ steps.sca.outcome }}
        shell: bash
        run: |
          echo "Bandit alta=$SAST; credenciales=$SECRETS; Safety=$SCA"
          if [ "$SAST" != "success" ] || [ "$SECRETS" != "success" ] || [ "$SCA" != "success" ]; then
            echo "BUILD BLOQUEADO: hay hallazgos o un analisis no se completo. Consulta los informes."
            exit 1
          fi
          echo "BUILD APROBADO: todos los analisis finalizaron correctamente."
